# `game_profiles.yaml` 放的是「遊戲本身固定不太會變」的設定。
# 如果你只是想改這次測試跑幾次、跑哪些帳號，請去改 `env.json`。

SS01:
  # 遊戲類型，runtime 會依這個值決定走 slot 還是 fish 流程。
  gameType: slot
  # 驗證 API，登入前先用它拿 access token。
  verify_url: https://kkk.com/game/ss01-api/v1/api/auth/verify
  # WebSocket 連線主機位置。
  socket_base_url: wss://kkk.com/
  # Socket.IO 專案路徑，通常只有換遊戲或環境才需要改。
  socket_path: game/ss01-socket/socket.io
  # 呼叫 verify API 時固定帶的 header。
  headers:
    Connection: keep-alive
    Content-Type: application/json
    platform: "1"
  # 驗證 API 的基本 payload，`{loginname}` 會在執行時被帳號替換掉。
  payload_template:
    username: "{loginname}"
    session: "{loginname}"
    pid: kkk
    gameid: abc
    platform: "1"
    isMobile: "0"
  # 老虎機盤面在 ACK JSON 裡的路徑，SS01 直接在最外層 `grid`。
  board_key:
    - grid
  # 盤面大小，格式固定是 [列 row, 欄 col]。
  grid:
    - 3
    - 5
  # 盤面驗算模式，SS01 是傳統 payline。
  mode: payline
  # 引用 Python 內預先定義好的 3x5 線型表。
  paylines_ref: PAYLINES_3X5
  # spin payload 要用哪一種 encoder。
  spin_payload_encoder: ss01
  # runtime 會依這份欄位定義，從 `events.loop` 取值後組出 protobuf。
  spin_payload_fields:
    bet_amount:
      source: data
      fallback: bet_amount
      default: "1.0"
  # 中獎表，key 是符號名稱，value 是連線數對應的賠付。
  paytable:
    皇冠:
      "3": 100
      "4": 200
      "5": 500
    斧頭:
      "3": 80
      "4": 150
      "5": 400
    盾牌:
      "3": 60
      "4": 120
      "5": 300
    戒指:
      "3": 40
      "4": 100
      "5": 250
    手套:
      "3": 30
      "4": 80
      "5": 200
    啤酒:
      "3": 20
      "4": 60
      "5": 180
    A:
      "3": 10
      "4": 60
      "5": 150
    K:
      "3": 10
      "4": 40
      "5": 120
    Q:
      "3": 10
      "4": 40
      "5": 100
    J:
      "3": 5
      "4": 30
      "5": 100
    X:
      "3": 5
      "4": 40
      "5": 100
  # 伺服器回傳的 symbol code 對照表，方便 log/CSV/本地驗算閱讀。
  symbol_map:
    "0": 皇冠
    "1": 斧頭
    "2": 盾牌
    "3": 戒指
    "4": 手套
    "5": 啤酒
    "6": A
    "7": K
    "8": Q
    "9": J
    "10": X
    "20": scatter
    "101": wild
    "102": x2wild
    "105": x5wild
    "110": x10wild

