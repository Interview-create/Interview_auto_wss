SS02:
  # SS02 是 cascading slot，但本地驗算規則是「全盤相同圖案數量達門檻」。
  gameType: slot
  verify_url: https://ss02.kkk/game/ss02-api/v1/api/auth/verify
  socket_base_url: wss://ss02.kkk/
  socket_path: game/ss02-socket/socket.io
  headers:
    Connection: keep-alive
    Content-Type: application/json
    platform: "1"
  payload_template:
    username: "{loginname}"
    session: "{loginname}"
    pid: kkk
    gameid: abc
    platform: "1"
    isMobile: "0"
  # SS02 的盤面在 `scenarios -> grid` 裡。
  board_key:
    - scenarios
    - grid
  grid:
    - 5
    - 6
  mode: cascading
  # 中獎規則名稱，讓 evaluator 直接知道這台是「全盤計數型」。
  win_rule: count_on_board
  # 畫面上至少要有幾個相同圖案才算中獎。
  min_cluster_count: 8
  spin_payload_encoder: ss02
  spin_payload_fields:
    bet_amount:
      source: bet_amount
      fallback: data
      default: "1.0"
    currency_code:
      source: bet_currency
      default: USD
    display_scale:
      source: display_scale
      default: 2
    compact_notation:
      source: compact_notation
      default: 0
  # SS02 paytable 採區間寫法：8-9、10-11、12+。
  paytable:
    船:
      8-9: 200
      10-11: 500
      12+: 1000
    飛機:
      8-9: 50
      10-11: 200
      12+: 500
    氣墊船:
      8-9: 40
      10-11: 100
      12+: 300
    甜筒:
      8-9: 20
      10-11: 30
      12+: 200
    冰淇淋:
      8-9: 30
      10-11: 40
      12+: 240
    冰棒:
      8-9: 16
      10-11: 24
      12+: 160
    芒果:
      8-9: 10
      10-11: 20
      12+: 100
    西瓜:
      8-9: 8
      10-11: 18
      12+: 80
    藍莓:
      8-9: 5
      10-11: 15
      12+: 40
  symbol_map:
    "0": 船
    "1": 飛機
    "2": 氣墊船
    "3": 冰淇淋
    "4": 甜筒
    "5": 冰棒
    "6": 芒果
    "7": 西瓜
    "8": 藍莓
    "20": scatter
    "101": wild
    "102": x2wild
    "105": x5wild
    "110": x10wild

